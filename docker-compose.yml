name: dashboard

services:
  docker-proxy:
    image: tecnativa/docker-socket-proxy:latest
    container_name: dashboard-socket-proxy
    restart: unless-stopped
    environment:
      # The mounted haproxy.cfg.template is a strict allow-list and ignores the stock ALLOW_* switches.
      - LOG_LEVEL=warning
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./docker-proxy/haproxy.cfg.template:/usr/local/etc/haproxy/haproxy.cfg.template:ro
    networks:
      - socket          # internal network: no published ports, no route out
    security_opt:
      - no-new-privileges:true
    mem_limit: 64m

  dashboard:
    build: .
    image: homelab-dashboard:local
    container_name: dashboard
    restart: unless-stopped
    user: "${PUID:-1000}:${PGID:-1000}"
    read_only: true
    env_file: .env
    environment:
      - TZ=${TZ:-UTC}
      - DOCKER_HOST=tcp://dashboard-socket-proxy:2375
    ports:
      # Bind to specific addresses, NEVER to 0.0.0.0 / all interfaces, and never forward these ports
      # on your router. Delete the Tailscale line if you do not use Tailscale.
      - "${LAN_IP:?set LAN_IP in .env}:${DASH_PORT:-8088}:8443"             # LAN (https, self-signed)
      - "${TAILSCALE_IP:?set TAILSCALE_IP in .env}:${DASH_PORT:-8088}:8443" # Tailscale
    volumes:
      - ./certs:/certs:ro
      - ./data:/data
      - type: bind                  # long syntax: fails with a clear error instead of creating a directory
        source: ./config.yaml       # when you forgot `cp config.example.yaml config.yaml`
        target: /config/config.yaml
        read_only: true
        bind:
          create_host_path: false
      - /sys/class/net/${NET_IFACE:?set NET_IFACE in .env}/statistics:/host/net/${NET_IFACE}:ro   # host NIC counters (a container's own /proc/net is not the host's)
      - ${SMART_DIR:-/var/lib/dashboard}:/host/smart:ro    # directory, not the file: the collector replaces the file atomically
      - ${DATA_PATH:?set DATA_PATH in .env}:/host/data:ro
      # md RAID mounts live in docker-compose.raid.yml (optional).
    networks:
      - socket
      - default
    depends_on:
      - docker-proxy
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 192m
    cpus: 0.5
    labels:
      # Local image build: Watchtower cannot pull it. Rebuild with ./update.sh instead.
      - com.centurylinklabs.watchtower.enable=false

networks:
  socket:
    internal: true
